services:
  database:
    container_name: webportal-database
    build:
      context: database
      dockerfile: ./Dockerfile
    restart: always
    env_file:
      - database/app/.env
    environment:
      - TZ=Asia/Bangkok
      - OTEL_SERVICE_NAME=Database-server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://splunk-otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=dev,service.version=Database-service
    ports:
      - 30202:8000
    networks:
      - dev_network

  backend:
    container_name: webportal-backend
    build:
      context: backend
      dockerfile: ./Dockerfile
    restart: always
    env_file:
      - backend/App/.env
    environment:
      - TZ=Asia/Bangkok
      - OTEL_SERVICE_NAME=Backend-server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://splunk-otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=dev,service.version=Backend-service
    ports:
      - "30201:8000"
    networks:
      - dev_network

  frontend:
    container_name: webportal-frontend
    build:
      context: frontend
      dockerfile: ./Dockerfile.ubuntu
    stdin_open: true
    tty: true
    restart: always
    env_file:
      - frontend/.env
    environment:
      - TZ=Asia/Bangkok
      - OTEL_SERVICE_NAME=Frontend-server
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://splunk-otel-collector:4318
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=dev,service.version=Frontend-service
      - OTEL_LOG_LEVEL=debug
      - SPLUNK_METRICS_ENABLED=true
      - SPLUNK_DEBUG_METRICS_ENABLED=true
      - SPLUNK_AUTOMATIC_LOG_COLLECTION=true
    ports:
      - "80:80"
      - "443:443"
    networks:
      - dev_network

  splunk-otel-collector:
    container_name: webportal-splunk-otel-collector
    image: quay.io/signalfx/splunk-otel-collector:latest
    env_file:
      - splunk-otel-collector-gateway/.env
    environment:
      - TZ=Asia/Bangkok
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
      - "14250:14250"
      - "14268:14268"
      - "6060:6060"
      - "7276:7276"
      - "8888:8888"
      - "9080:9080"
      - "9411:9411"
      - "9943:9943"
    networks:
      - dev_network

networks:
  dev_network:
