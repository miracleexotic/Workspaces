services:
  splunk-otel-collector:
    container_name: webportal-splunk-otel-collector
    image: quay.io/signalfx/splunk-otel-collector:latest
    env_file:
      - splunk-otel-collector-gateway/.env
    environment:
      - TZ=Asia/Bangkok
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
      - "14250:14250"
      - "14268:14268"
      - "6060:6060"
      - "7276:7276"
      - "8888:8888"
      - "9080:9080"
      - "9411:9411"
      - "9943:9943"
    networks:
      - dev_network

networks:
  dev_network:
