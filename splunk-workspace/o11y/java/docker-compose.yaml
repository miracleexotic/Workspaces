services:
  splunk-otel-collector:
    container_name: splunk-otel-collector
    image: quay.io/signalfx/splunk-otel-collector:latest
    env_file:
      - splunk-otel-collector-gateway/.env
    environment:
      - TZ=Asia/Bangkok
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
      - "14250:14250"
      - "14268:14268"
      - "6060:6060"
      - "7276:7276"
      - "8888:8888"
      - "9080:9080"
      - "9411:9411"
      - "9943:9943"
    networks:
      - dev_network

  jboss:
    container_name: jboss
    build:
      context: JBOSS
      dockerfile: ./Dockerfile
    restart: always
    env_file:
      - splunk-otel-collector-gateway/.env
    environment:
      - TZ=Asia/Bangkok
      - OTEL_SERVICE_NAME='jboss'
      - OTEL_RESOURCE_ATTRIBUTES='deployment.environment=dev,service.version=1.0.0'
      - OTEL_EXPORTER_OTLP_ENDPOINT='http://splunk-otel-collector:4318'
    ports:
      - "9990:9990"
      - "8180:8180"
      - "8190:8190"
      - "8280:8280"
      - "8290:8290"
    networks:
      - dev_network

networks:
  dev_network:
